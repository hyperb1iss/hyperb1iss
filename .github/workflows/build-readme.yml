name: Build README

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/build_readme.py
      - .github/workflows/build-readme.yml

permissions:
  contents: write

concurrency:
  group: build-readme
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Rewrite generated blocks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run scripts/build_readme.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- README.md; then
            echo "nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore(readme): refresh releases and stats" \
            -m "Automated rewrite of the generated blocks from GitHub data."
          git push
